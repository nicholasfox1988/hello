<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>韩国海/空运数据</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="./js/vue.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        .search-container {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        #searchInput {
            padding: 8px;
            /* flex-grow: 1; */
            width: 100px;
            font-size: 16px;
        }

        button {
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
            position: sticky;
            top: 0;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        tr.row-checked td {
            color: #777;
            opacity: 0.6;
            text-decoration: line-through;
        }

        .file-input {
            margin-bottom: 20px;
        }

        .no-results {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        #showing {
            padding: 20px;
            width: 60%;
            border: solid;
            border-color: green;
            border-radius: 30px;
            margin: auto;
        }
    </style>
</head>

<body>
    <div id="app">
        <div>
            <input type="file" id="fileInput" accept=".xlsx, .xls" @change="loadData($event)">
            <span v-html="hold">Hold Item: </span>
        </div>
        <div id="tableContainer">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th><button class="diaomao" @dblclick="showAll" @click="hide">点击</button></th>
                        <th>name</th>
                        <th>Pic</th>
                        <th>fo</th>
                        <th>No</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr v-for="(row,index) in excelData" :key="index" :class="{'row-checked': row.tick}"
                        v-show="!row.hide">
                        <td><input type="checkbox" v-model="row.tick"></td>
                        <td>{{ row.name }}</td>
                        <td>{{ row.pis }}</td>
                        <td>{{ row.fo }}</td>
                        <td>{{ row.no }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const app = new Vue({
            el: '#app',
            data: {
                excelData: [],
                hold: ''
            },
            methods: {
                loadData(event) {
                    const file = event.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });

                        // Get the last sheet
                        const lastSheetName = workbook.SheetNames[workbook.SheetNames.length - 1];
                        const worksheet = workbook.Sheets[lastSheetName];

                        // Convert to JSON
                        const jsonData1 = XLSX.utils.sheet_to_json(worksheet);
                        const excelData = jsonData1.map(row => {
                            return {
                                tick: false,
                                hide: false,
                                name: row.name,
                                pis: row.pieces,
                                fo: row.fo,
                                no: row.account_no
                            };
                        });

                        const save1 = jsonData1.filter(row => row.fo.includes('AION') || row.hold).sort((a, b) => {
                            const nameA = a['fo'].toUpperCase(); // 忽略大小写
                            const nameB = b['fo'].toUpperCase();
                            if (nameA < nameB) {
                                return -1;
                            }
                            if (nameA > nameB) {
                                return 1;
                            }
                            return 0;
                        });
                        const nameList = save1.map(item => item.name);

                        const save4 = jsonData1.filter(row => row['delivery type'] === 'C' || row['delivery type'] === 'S' && !row.fo.includes('AION')).sort((a, b) => {
                            const nameA = a['pic']; // 忽略大小写
                            const nameB = b['pic'];
                            if (nameA < nameB) {
                                return -1;
                            }
                            if (nameA > nameB) {
                                return 1;
                            }
                            return 0;
                        });
                        // console.log(jsonData1);
                        app.hold = `Hold Item: ${nameList.join(', ')},~~~~CS的数量:${save4.length}`;

                        // sort by no
                        excelData.sort((a, b) => a.no - b.no);
                        app.excelData = excelData;
                    };
                    reader.readAsArrayBuffer(file);
                },
                hide() {
                    this.excelData.forEach(element => {
                        if (element.tick) element.hide = true;
                    });
                },
                showAll() {
                    this.excelData.forEach(element => element.hide = false);
                }
            }
        });
    </script>
</body>

</html>
